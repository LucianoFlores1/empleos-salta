<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>Empleos Salta | Ofertas de Trabajo y Oportunidades Laborales</title>

    <!-- Evita el "flash" de tema claro: aplica dark antes de pintar -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          var dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) {
            document.documentElement.classList.add('dark');
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute('content', '#211b15');
          }
        } catch (e) {}
      })();
    </script>

    <!-- Tipografías: Bricolage Grotesque (títulos) + Plus Jakarta Sans (texto) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
    />
    
    <!-- Meta etiquetas de SEO -->
    <meta name="description" content="Descubrí las mejores ofertas de empleo y oportunidades laborales en la provincia de Salta. Buscá trabajo en Salta Capital y el interior de forma rápida y sencilla." />
    <meta name="keywords" content="empleos salta, trabajo salta, ofertas laborales salta, busco trabajo salta, empleos salta capital, portal de empleo salta" />
    <meta name="author" content="Portal Empleos Salta" />
    <meta name="robots" content="index, follow" />
    <meta name="language" content="Spanish">
    
    <!-- Meta etiquetas amigables para IA (LLMs) -->
    <meta name="application-name" content="Empleos Salta">
    
    <!-- Etiquetas Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Empleos Salta | El Portal de Oportunidades Laborales" />
    <meta property="og:description" content="Buscá y encontrá tu próximo trabajo en Salta. Ofertas laborales actualizadas de forma permanente." />
    <meta property="og:image" content="/logo.webp" />
    <meta property="og:site_name" content="Empleos Salta" />
    <meta property="og:locale" content="es_AR" />
    
    <!-- Etiquetas Twitter Cards -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Empleos Salta | Ofertas de Trabajo" />
    <meta name="twitter:description" content="Buscá y encontrá tu próximo trabajo en Salta con nuestro portal." />
    <meta name="twitter:image" content="/logo.webp" />

    <!-- Iconos (por defecto) -->
    <link rel="icon" type="image/webp" href="/logo.webp" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
